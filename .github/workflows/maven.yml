name: reactome-parent

# Every POM built on each pull request and push, unsigned. On a version tag (v*), signed and
# uploaded to Maven Central through Sonatype's Central Portal, and published as soon as Central
# validates it (autoPublish, set in the POMs, so libraries using reactome-parent do the same).
# The publish job runs in the `maven-central` environment, so GitHub asks a person to approve
# it before anything is uploaded, and the Sonatype token and the signing key are that
# environment's secrets, never on anyone's machine.

on:
    pull_request:
    push:
        branches: [main]
        tags: ['v*']

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: maven
            # A POM on Central is there for good, and whoever uses it inherits its repositories.
            # EBI's Nexus is going away, so no published POM may send a build there.
            - name: No published POM names a repository of its own
              run: |
                  ! grep -nE '<(repositories|pluginRepositories|distributionManagement)>|ebi\.ac\.uk/Tools/maven' \
                      boms/pom.xml boms/*/pom.xml parents/reactome-parent/pom.xml
            - name: Every POM, unsigned
              run: |
                  for pom in boms/pom.xml parents/reactome-parent/pom.xml; do
                      mvn -B -ntp -Dgpg.skip -f "$pom" install
                  done
            # A child sees every version the parent and its BOMs manage. One that names a property
            # nobody defines reaches the child as the literal ${...}, and Maven says nothing.
            - name: A child of reactome-parent sees no unresolved version
              run: |
                  version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout -f parents/reactome-parent/pom.xml)
                  mkdir -p "$RUNNER_TEMP/child"
                  cat > "$RUNNER_TEMP/child/pom.xml" <<EOF
                  <project xmlns="http://maven.apache.org/POM/4.0.0">
                      <modelVersion>4.0.0</modelVersion>
                      <parent><groupId>org.reactome.maven</groupId><artifactId>reactome-parent</artifactId><version>$version</version></parent>
                      <artifactId>child</artifactId>
                  </project>
                  EOF
                  mvn -B -ntp -q help:effective-pom -Doutput="$RUNNER_TEMP/child/effective.xml" -f "$RUNNER_TEMP/child/pom.xml"
                  ! grep -nE '<version>[^<]*\$\{' "$RUNNER_TEMP/child/effective.xml"
            # A library using reactome-parent publishes its release once Central validates it, and
            # its deploy waits until the release is live, so one that fails to publish fails.
            - name: A child of reactome-parent publishes itself, and waits until it is live
              run: |
                  mvn -B -ntp -q -Dsonatype-deploy=true help:effective-pom -Doutput="$RUNNER_TEMP/child/deploy.xml" -f "$RUNNER_TEMP/child/pom.xml"
                  grep -q '<autoPublish>true</autoPublish>' "$RUNNER_TEMP/child/deploy.xml"
                  grep -q '<waitUntil>published</waitUntil>' "$RUNNER_TEMP/child/deploy.xml"
            # reactome-parent imports the reactome-bom this repository publishes with it.
            - name: reactome-parent imports this reactome-bom's version
              run: |
                  bom=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout -N -f boms/reactome-bom/pom.xml)
                  imported=$(mvn -B -ntp -q help:evaluate -Dexpression=reactome.reactome-bom.version -DforceStdout -N -f parents/reactome-parent/pom.xml)
                  echo "reactome-bom $bom; reactome-parent imports $imported"
                  test "$bom" = "$imported"
            # A dependency joins a published POM only once its version is on Maven Central.
            - name: Every version the published POMs manage is on Maven Central
              run: |
                  python3 .github/managed-on-central.py "$RUNNER_TEMP/child/effective.xml" \
                      boms/reactome-bom/pom.xml parents/reactome-parent/pom.xml

    publish:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        environment: maven-central
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: The tag is on main and names reactome-parent's version
              run: |
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main
                  version=$(sed -n '0,/<artifactId>reactome-parent<\/artifactId>/d; s:.*<version>\(.*\)</version>.*:\1:p' parents/reactome-parent/pom.xml | head -1)
                  test "$GITHUB_REF_NAME" = "v$version"
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: '17'
                  server-id: central
                  server-username-env-var: MAVEN_CENTRAL_USERNAME
                  server-password-env-var: MAVEN_CENTRAL_PASSWORD
                  gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
                  gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
            - name: Signed, and uploaded to the Central Portal
              env:
                  MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                  MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
                  MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
              # A BOM already on Central is not uploaded again (Central refuses it): see
              # boms-to-publish.sh. reactome-parent's version is the tag's, so it is always new.
              run: |
                  boms=$(.github/boms-to-publish.sh)
                  if [ -n "$boms" ]; then
                      mvn -B -ntp -Dsonatype-deploy=true -f boms/pom.xml -pl "$boms" deploy
                  else
                      echo "Both BOMs' versions are on Central already"
                  fi
                  mvn -B -ntp -Dsonatype-deploy=true -f parents/reactome-parent/pom.xml deploy
