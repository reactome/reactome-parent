# Dependency updates, weekly. Minor and patch updates come grouped in one pull request;
# a major one comes on its own, since it may need code changes. CI (the build, the
# licence check, the strict compile) is what says an update is safe.
version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /boms
      - /boms/reactome-bom
      - /parents/reactome-parent
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
